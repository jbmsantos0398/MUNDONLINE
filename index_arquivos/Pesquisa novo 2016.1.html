function buscarNoSite() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const listaResultados = document.getElementById('searchResults');
    
    // Limpa os resultados anteriores
    listaResultados.innerHTML = '';
    
    if (input.trim() === '') {
        listaResultados.style.display = 'none';
        return;
    }
    
    // Filtra as páginas baseado no título ou palavras-chave
    const resultadosFiltrados = paginasDoSite.filter(pagina => {
        return pagina.titulo.toLowerCase().includes(input) || 
               pagina.palavrasChave.toLowerCase().includes(input);
    });
    
    // Exibe os resultados na tela
    if (resultadosFiltrados.length > 0) {
        listaResultados.style.display = 'block';
        resultadosFiltrados.forEach(pagina => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${pagina.url}">${pagina.titulo}</a>`;
            listaResultados.appendChild(li);
        });
    } else {
        listaResultados.style.display = 'block';
        listaResultados.innerHTML = '<li style="color: red;">Nenhum resultado encontrado</li>';
    }
}
// Fecha a lista de resultados se o usuário clicar fora dela
document.addEventListener('click', function(e) {
    if (!document.querySelector('.search-box').contains(e.target)) {
        document.getElementById('searchResults').style.display = 'none';
    }
});

<div style="background-color:black;color:white;padding:30px">Scroll Down</div>
<div style="background-color:lightgrey;padding:30px 30px 2500px">This example demonstrates how to create a "scroll to top" button that becomes visible 
  <strong>when the user starts to scroll the page</strong>.</div>
<!---------------------------------------------------------------------------------->
<script>
// Get the button
let mybutton = document.getElementById("myBtn");
// When the user scrolls down 20px from the top of the document, show the button
window.onscroll = function() {scrollFunction()};
function scrollFunction() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    mybutton.style.display = "block";
  } else {
    mybutton.style.display = "none";
  }
}
// When the user clicks on the button, scroll to the top of the document
function topFunction() {
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
}
</script></body></html>
